<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apple 概念機型連結</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
  <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
</head>
<body>
  <ion-app>
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Apple 概念機型連結</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content id="container"></ion-content>
  </ion-app>

  <script>
    // 統一加上 Trade-In 與不加購 AppleCare+ 的參數
    const param = '?step=tradein&applecare=false';

    const data = [
      {
        name: 'iPhone Duo',
        capacities: [
          { capacity: '256GB', items: [{ color: '星光白色', url: 'https://www.apple.com/hk-zh/xc/product/MK2D4ZA/A' + param }, { color: '夜空色', url: 'https://www.apple.com/hk-zh/xc/product/MK2E4ZA/A' + param }] },
          { capacity: '512GB', items: [{ color: '星光白色', url: 'https://www.apple.com/hk-zh/xc/product/MK2F4ZA/A' + param }, { color: '夜空色', url: 'https://www.apple.com/hk-zh/xc/product/MK2G4ZA/A' + param }] },
          { capacity: '1TB', items: [{ color: '星光白色', url: 'https://www.apple.com/hk-zh/xc/product/MK2H4ZA/A' + param }, { color: '夜空色', url: 'https://www.apple.com/hk-zh/xc/product/MK2J4ZA/A' + param }] },
          { capacity: '2TB', items: [{ color: '星光白色', url: 'https://www.apple.com/hk-zh/xc/product/MK2K4ZA/A' + param }, { color: '夜空色', url: 'https://www.apple.com/hk-zh/xc/product/MK2L4ZA/A' + param }] }
        ]
      },
      {
        name: 'iPhone 18 Pro',
        capacities: [
          { capacity: '256GB', items: [{ color: '布根地紅色', url: 'https://www.apple.com/hk-zh/xc/product/MJXA4ZA/A' + param }, { color: '冰川色', url: 'https://www.apple.com/hk-zh/xc/product/MJXB4ZA/A' + param }, { color: '黑色', url: 'https://www.apple.com/hk-zh/xc/product/MJXC4ZA/A' + param }, { color: '銀色', url: 'https://www.apple.com/hk-zh/xc/product/MJXD4ZA/A' + param }] },
          { capacity: '512GB', items: [{ color: '布根地紅色', url: 'https://www.apple.com/hk-zh/xc/product/MJXE4ZA/A' + param }, { color: '冰川色', url: 'https://www.apple.com/hk-zh/xc/product/MJXF4ZA/A' + param }, { color: '黑色', url: 'https://www.apple.com/hk-zh/xc/product/MJXG4ZA/A' + param }, { color: '銀色', url: 'https://www.apple.com/hk-zh/xc/product/MJXH4ZA/A' + param }] }
        ]
      },
      {
        name: 'iPhone 18 Pro Max',
        capacities: [
          { capacity: '256GB', items: [{ color: '布根地紅色', url: 'https://www.apple.com/hk-zh/xc/product/MJXQ4ZA/A' + param }, { color: '冰川色', url: 'https://www.apple.com/hk-zh/xc/product/MJXR4ZA/A' + param }, { color: '黑色', url: 'https://www.apple.com/hk-zh/xc/product/MJXS4ZA/A' + param }, { color: '銀色', url: 'https://www.apple.com/hk-zh/xc/product/MJXT4ZA/A' + param }] },
          { capacity: '512GB', items: [{ color: '布根地紅色', url: 'https://www.apple.com/hk-zh/xc/product/MJXU4ZA/A' + param }, { color: '冰川色', url: 'https://www.apple.com/hk-zh/xc/product/MJXV4ZA/A' + param }, { color: '黑色', url: 'https://www.apple.com/hk-zh/xc/product/MJXW4ZA/A' + param }, { color: '銀色', url: 'https://www.apple.com/hk-zh/xc/product/MJXX4ZA/A' + param }] }
        ]
      }
    ];

    const container = document.getElementById('container');
    let html = '<ion-list>';
    data.forEach(model => {
      html += `<ion-item-divider color="light"><ion-label><h2>${model.name}</h2></ion-label></ion-item-divider>`;
      model.capacities.forEach(cap => {
        html += `<ion-list-header><ion-label>${cap.capacity}</ion-label></ion-list-header>`;
        cap.items.forEach(item => {
          html += `
            <ion-item href="${item.url}" target="_blank" detail="true">
              <ion-label>
                <h3>${item.color}</h3>
                <p>${item.url}</p>
              </ion-label>
            </ion-item>`;
        });
      });
    });
    html += '</ion-list>';
    container.innerHTML = html;
  </script>
</body>
</html>
